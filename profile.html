<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile — Build Forge</title>
  <meta name="description" content="View and manage your Build Forge profile, account details, saved PC configurations, and favorited components." />

  <!-- Synchronous theme init to prevent light-theme flash -->
  <script>
    (function() {
      try {
        const stored = localStorage.getItem('buildforge_theme');
        const theme = (stored === 'dark' || stored === 'light')
          ? stored
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (_) {}
    })();
  </script>

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/animations.css" />
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div class="page">
    <header id="site-header" class="site-header"></header>

    <main class="page__main">
      <div class="profile-container" id="profile-root">
        <!-- Rendered dynamically by js/profile.js -->
        <div class="profile-card skeleton" style="height: 380px;"></div>
      </div>
    </main>

    <footer id="site-footer" class="site-footer"></footer>
  </div>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
