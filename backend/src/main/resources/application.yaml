spring:
  application:
    name: pcbuilder

  datasource:
    url: ${DATASOURCE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${SECRET}

server:
  port: ${PORT:8080}